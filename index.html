<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galaga</title>
  <link data-trunk rel="rust" data-target-name="galaga_core" data-wasm-opt="0">
  <link data-trunk rel="copy-file" href="assets/icon.png">
  <link rel="icon" href="icon.png">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: black; overflow: hidden; }
    #game { width: 100%; height: 100%; display: block; outline: none; }
    #tools { position: fixed; right: 8px; bottom: 8px; opacity: .65; }
    button { color: #ddd; background: #111; border: 1px solid #444; cursor: pointer; }
    #status { position: fixed; top: 8px; left: 8px; color: white; font: 14px sans-serif; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Galaga game. Arrow keys or A D to move, space to start or shoot, P to pause, Escape for menu."></canvas>
  <div id="tools"><button id="audio">Enable audio</button> <button id="screenshot">Screenshot</button></div>
  <div id="status">Loading Galaga...</div>
  <script>
    window.addEventListener("TrunkApplicationStarted", async () => {
        const wasm = window.wasmBindings;
        const canvas = document.getElementById("game");
        const enable = () => {
          try { wasm.unlock_audio(); } catch (error) { console.warn("Audio unavailable", error); }
        };
        canvas.addEventListener("pointerdown", () => { canvas.focus(); enable(); });
        canvas.addEventListener("keydown", (event) => {
          if (["Space", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(event.code)) event.preventDefault();
          enable();
        });
        document.getElementById("audio").onclick = () => { enable(); canvas.focus(); };
        document.getElementById("screenshot").onclick = () => {
          wasm.request_screenshot();
          canvas.focus();
        };
        try {
          await wasm.start(canvas);
          document.getElementById("status").remove();
          canvas.focus();
        } catch (error) {
          document.getElementById("status").textContent = `Unable to start Galaga: ${error}`;
        }
    });
  </script>
</body>
</html>
