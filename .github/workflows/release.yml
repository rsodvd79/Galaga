name: CI & Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev libegl1-mesa-dev pkg-config xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Native screenshot smoke test
        if: runner.os == 'Linux'
        run: |
          rm -f screenshots/galaga_menu.png screenshots/galaga_playing.png
          timeout 40s xvfb-run -a target/${{ matrix.target }}/release/galaga --screenshots
          python3 -c "import struct; from pathlib import Path; files = [Path('screenshots/galaga_menu.png'), Path('screenshots/galaga_playing.png')]; assert all(struct.unpack('>II', p.read_bytes()[16:24]) == (800, 600) for p in files)"
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - name: Package native artifact
        run: python scripts/package.py ${{ matrix.target }} 1.0.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: galaga-${{ matrix.target }}
          path: publish/*.zip

  web:
    name: WebAssembly
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - run: cargo clippy --target wasm32-unknown-unknown --lib --locked -- -D warnings
      - uses: jetli/trunk-action@v0.5.0
        with:
          version: v0.21.14
      - run: trunk build --release --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.64.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
      - name: Browser smoke tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          for browser in chromium firefox webkit; do
            BROWSER="$browser" NODE_PATH="$RUNNER_TEMP/browser/node_modules" node tests/web_smoke.cjs
          done
      - name: Package static website
        run: |
          cd dist
          zip -r "../Galaga-1.0.${{ github.run_number }}-web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: galaga-web
          path: Galaga-*-web.zip

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Galaga v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: artifacts/*.zip
